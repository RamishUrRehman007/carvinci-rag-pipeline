[project]
name = "carvinci-rag-pipeline"
version = "0.1.0"
description = "Upload PDF documents and query them with natural language (RAG)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.142.2",
    "langchain-pymupdf4llm>=1.28.0",
    "pydantic-settings>=2.15.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.fastapi]
entrypoint = "app.main:app"
